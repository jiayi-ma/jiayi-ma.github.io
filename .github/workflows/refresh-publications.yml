name: Refresh Jiayi Ma publications

on:
  workflow_dispatch:
  schedule:
    - cron: "18 */6 * * *" # Every six hours; staggered to reduce Scholar rate-limit risk.

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Synchronise and enrich publication data
        id: refresh_data
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/sync_publications.py --out res/publications.json
          python tools/sync_profile.py --out res/profile.json
          python tools/sync_whu_profile_source.py --out res/whu-profile-source.json
          python tools/sync_students.py --source res/whu-profile-source.json --index index.html
          python tools/enrich_publications.py --file res/publications.json
          python tools/resolve_paper_links.py --file res/publications.json --limit 20 --workers 4 --delay 0
          python tools/discover_github_links.py --file res/publications.json --limit 25
          python tools/sync_scholar.py --file res/publications.json --summary res/scholar.json
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html res/publications.json res/scholar.json res/profile.json res/whu-profile-source.json
          git diff --cached --quiet || git commit -m "Refresh profile, students, and Scholar data"
          git push
      - name: Mark failed Scholar refresh
        if: steps.refresh_data.outcome == 'failure'
        run: |
          echo "Google Scholar rejected this scheduled request; the site retains its last successful citation snapshot." >&2
          exit 1
